name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'personal-console-android-v1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip personal-console-android-v1.zip -d extracted
          test -f extracted/personal-console-android/settings.gradle

      - name: Build APK
        working-directory: extracted/personal-console-android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-console-debug-apk
          path: extracted/personal-console-android/app/build/outputs/apk/debug/app-debug.apk
